    post:
      consumes:
      - multipart/form-data
      description: Register a new user with email, name, username, password, gender,
        date of birth, security question, security answer, avatar, and banner
      parameters:
      - description: Email
        in: formData
        name: email
        required: true
        type: string
      - description: Name
        in: formData
        name: name
        required: true
        type: string
      - description: Username
        in: formData
        name: username
        required: true
        type: string
      - description: Password
        in: formData
        name: password
        required: true
        type: string
      - description: Gender
        in: formData
        name: gender
        required: true
        type: string
      - description: Date of birth
        in: formData
        name: date_of_birth
        required: true
        type: string
      - description: Security question
        in: formData
        name: security_question
        required: true
        type: string
      - description: Security answer
        in: formData
        name: security_answer
        required: true
        type: string
      - description: Avatar image (PNG)
        in: formData
        name: avatar
        required: true
        type: file
      - description: Banner image (PNG)
        in: formData
        name: banner
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ApiResponse'
      summary: Register a new user
      tags:
      - user
