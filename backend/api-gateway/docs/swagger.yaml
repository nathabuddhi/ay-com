info:
  contact: {}
paths:
  /user/blockuser:
    post:
      consumes:
      - application/json
      description: Block another user
      parameters:
      - description: Block user request
        in: body
        name: blockUser
        required: true
        schema:
          $ref: '#/definitions/user.BlockUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ApiResponse'
      summary: Block a user
      tags:
      - user
  /user/changepassword:
    patch:
      consumes:
      - application/json
      description: Change the password for the authenticated user
      parameters:
      - description: Change password request
        in: body
        name: changePassword
        required: true
        schema:
          $ref: '#/definitions/user.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ApiResponse'
      summary: Change user password
      tags:
      - user
  /user/checktoken:
    post:
