syntax = "proto3";

package user;

import "google/protobuf/any.proto";

option go_package = "user/";

service UserService {
    rpc User_Register (RegisterRequest) returns (ApiResponseUser);
    rpc User_Login (LoginRequest) returns (ApiResponseUser);
    rpc User_RequestVerificationCode (VerificationRequest) returns (ApiResponseUser);
    rpc User_ValidateVerificationCode (ValidateCodeRequest) returns (ApiResponseUser);
    rpc User_GetSecurityQuestion (GetSecurityQuestionRequest) returns (ApiResponseUser);
    rpc User_ValidateSecurityAnswer (ValidateSecurityAnswerRequest) returns (ApiResponseUser);
    rpc User_ResetPassword (ResetPasswordRequest) returns (ApiResponseUser);
    rpc User_GetFollowRecommendations (StringUser) returns (ApiResponseUser);

    // protected routes
    rpc User_GetProfile (GetProfileRequest) returns (ApiResponseUser);
    rpc User_GetUserId (GetProfileRequest) returns (ApiResponseUser);
    rpc User_ChangePassword (ChangePasswordRequest) returns (ApiResponseUser);
    rpc User_UpdateProfile (UpdateUserProfileRequest) returns (ApiResponseUser);
    rpc User_SearchPeople (SearchPeopleRequest) returns (ApiResponseUser);
    rpc User_GetSelfProfile (StringUser) returns (ApiResponseUser);

    rpc User_FollowUser (FollowUserRequest) returns (ApiResponseUser);
    rpc User_BlockUser (BlockUserRequest) returns (ApiResponseUser);
    rpc User_UnFollowUser (UnFollowUserRequest) returns (ApiResponseUser);
    rpc User_UnBlockUser (UnBlockUserRequest) returns (ApiResponseUser);

    rpc User_GetSettings (GetSettingsRequest) returns (ApiResponseUser);
    rpc User_UpdateSettings (UpdateSettingsRequest) returns (ApiResponseUser);
    rpc User_DeactivateAccount (DeactivateAccountRequest) returns (ApiResponseUser);

    rpc User_GetAllFollowers (GetAllFollowersRequest) returns (ApiResponseUser);
    rpc User_GetAllFollowing (GetAllFollowingRequest) returns (ApiResponseUser);
    rpc User_GetAllBlocked (StringUser) returns (ApiResponseUser);

    rpc User_SubmitVerifyAccountRequest (SubmitVerifyAccountRequest) returns (ApiResponseUser);
    rpc User_GetAllVerifyAccountRequest (GetAllVerifyAccountRequest) returns (ApiResponseUser);
    rpc User_IsUserPrivate (IsAccountPrivateRequest) returns (BoolUser);
    rpc User_IsUserFollowing (IsUserFollowingRequest) returns (BoolUser);

    rpc User_RefreshToken(StringUser) returns (ApiResponseUser);

    // Admin routes
    rpc Admin_IsUserAdmin(StringUser) returns (BoolUser);
    rpc Admin_GetAllVerifyAccountRequest (StringUser) returns (ApiResponseUser);
    rpc Admin_ApprovePremiumRequest (StringUser) returns (ApiResponseUser);
    rpc Admin_RejectPremiumRequest (RejectPremiumRequest) returns (ApiResponseUser);
}

message ApiResponseUser {
    bool success = 1;
    string message = 2;
    google.protobuf.Any data = 3;
}

message GetFollowRecommendationsResponse {
    repeated string user_ids = 1;
}

message StringUser {
    string value = 1;
}

message BoolUser {
    bool value = 1;
}

message RejectPremiumRequest{
    string id = 1;
    string reason = 2;
}

message UserProfile {
    string user_id = 1;
    string username = 2;
    string name = 3;
    string bio = 4;
    bool is_verified = 5;
    int32 followers = 6;
    int32 following = 7;
    string date_of_birth = 8;
    string gender = 9;
    string email = 10;
    string join_date = 11;
    bool is_private = 12;
}

message GetProfileRequest {
    string user_id = 1;
    string requester_id = 2;
}

message RegisterRequest {
    string email = 1;
    string password = 2;
    string google_auth_id = 3;
    string username = 4;
    string name = 5;
    string security_question = 6;
    string security_answer = 7;
    string date_of_birth = 8;
    bytes profile_picture = 9;
    bytes banner = 10;
    bool wants_newsletter = 11;
    string gender = 12;
}

message LoginRequest {
    string email = 1;
    string password = 2;
}

message VerificationRequest {
    string email = 1;
}

message ValidateCodeRequest {
    string email = 1;
    string code = 2;
}

message ChangePasswordRequest {
    string email = 1;
    string old_password = 2;
    string new_password = 3;
    string user_id = 4;
}

message GetSecurityQuestionRequest {
    string email = 1;
}

message ResetPasswordRequest {
    string email = 1;
    string code = 2;
    string new_password = 3;
}

message ValidateSecurityAnswerRequest {
    string email = 1;
    string answer = 2;
    string question = 3;
}

message FollowUserRequest {
    string user_id = 1;
    string to_follow_id = 2;
}

message BlockUserRequest {
    string user_id = 1;
    string to_block_id = 2;
}

message UnFollowUserRequest {
    string user_id = 1;
    string to_unfollow_id = 2;
}

message UnBlockUserRequest {
    string user_id = 1;
    string to_unblock_id = 2;
}

message GetSettingsRequest {
    string user_id = 1;
}

message UpdateSettingsRequest {
    string user_id = 1;
    string font_size = 2;
    string font_color = 3;
    bool private = 4;
}

message UserSettings {
    string font_size = 1;
    string font_color = 2;
    bool private = 3;
}

message DeactivateAccountRequest {
    string user_id = 1;
    string password = 2;
}

message SubmitVerifyAccountRequest {
    string user_id = 1;
    string identity_card_number = 2;
    string selfie_url = 3;
    string reason_text = 4;
}

message VerifyAccountRequest {
    string user_id = 1;
    string id = 2;
    string reason_text = 3;
    string status = 4;
    string submitted_at = 5;
    string selfie_url = 6;
}

message GetAllVerifyAccountRequest {
    string user_id = 1;
    string password = 2;
}

message GetAllVerifyAccountResponse {
    repeated VerifyAccountRequest requests = 1;
}

message GetAllFollowersRequest {
    string user_id = 1;
    string requester_id = 2;
}

message GetAllFollowingRequest {
    string user_id = 1;
    string requester_id = 2;
}

message AllFollowersResponse {
    repeated StringUser followers = 1;
}

message AllFollowingResponse {
    repeated StringUser following = 1;
}

message UpdateUserProfileRequest {
    string user_id = 1; 
    string username = 2;
    string name = 3;
    string bio = 4;
    string gender = 5;
    string date_of_birth = 6;
}

message IsAccountPrivateRequest {
    string user_id = 1;
}

message IsUserFollowingRequest {
    string follower_id = 1;
    string following_id = 2;
}

message SearchPeopleRequest {
    string keyword = 1;
}

message LoginResponse {
    string token = 1;
    string user_id = 2;
    string username = 3;
    string name = 4;
    bool is_verified = 5;
    string refresh_token = 6;
    bool is_admin = 7;
}

message BlockedUser {
    string user_id = 1;
    string username = 2;
    string name = 3;
}

message AllBlockedUserResponse {
    repeated BlockedUser blocked = 1;
}

message RefreshTokenResponse {
    string refresh_token = 1;
    string access_token = 2;
}