syntax = "proto3";

package user;

import "google/protobuf/any.proto";

option go_package = "user/";

service UserService {
    rpc User_Register (RegisterRequest) returns (ApiResponse);
    rpc User_Login (LoginRequest) returns (ApiResponse);
    rpc User_RequestVerificationCode (VerificationRequest) returns (ApiResponse);
    rpc User_ValidateVerificationCode (ValidateCodeRequest) returns (ApiResponse);
    rpc User_GetSecurityQuestion (GetSecurityQuestionRequest) returns (ApiResponse);
    rpc User_ValidateSecurityAnswer (ValidateSecurityAnswerRequest) returns (ApiResponse);
    rpc User_ResetPassword (ResetPasswordRequest) returns (ApiResponse);

    // protected routes
    rpc User_GetProfile (GetProfileRequest) returns (ApiResponse);
    rpc User_ChangePassword (ChangePasswordRequest) returns (ApiResponse);
    rpc User_FollowUser (FollowUserRequest) returns (ApiResponse);
    rpc User_BlockUser (BlockUserRequest) returns (ApiResponse);
    rpc User_UnFollowUser (UnFollowUserRequest) returns (ApiResponse);
    rpc User_UnBlockUser (UnBlockUserRequest) returns (ApiResponse);
}

message ApiResponse {
  bool success = 1;
  string message = 2;
  google.protobuf.Any data = 3;
}

message String {
  string value = 1;
}

message Bool {
  bool value = 1;
}

message UserProfile {
  string user_id = 1;
  string username = 2;
  string name = 3;
  string bio = 4;
  bool is_verified = 5;
  int32 followers = 6;
  int32 following = 7;
}

message GetProfileRequest {
  string user_id = 1;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string google_auth_id = 3;
  string username = 4;
  string name = 5;
  string security_question = 6;
  string security_answer = 7;
  string date_of_birth = 8;
  bytes profile_picture = 9;
  bytes banner = 10;
  bool wants_newsletter = 11;
  string gender = 12;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message VerificationRequest {
  string email = 1;
}

message ValidateCodeRequest {
  string email = 1;
  string code = 2;
}

message ChangePasswordRequest {
    string email = 1;
    string old_password = 2;
    string new_password = 3;
    string user_id = 4;
}

message GetSecurityQuestionRequest {
    string email = 1;
}

message ResetPasswordRequest {
    string email = 1;
    string code = 2;
    string new_password = 3;
}

message ValidateSecurityAnswerRequest {
    string email = 1;
    string answer = 2;
    string question = 3;
}

message FollowUserRequest {
    string user_id = 1;
    string to_follow_id = 2;
}

message BlockUserRequest {
    string user_id = 1;
    string to_block_id = 2;
}

message UnFollowUserRequest {
    string user_id = 1;
    string to_unfollow_id = 2;
}

message UnBlockUserRequest {
    string user_id = 1;
    string to_unblock_id = 2;
}